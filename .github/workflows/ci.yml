name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pyflakes src tests scripts
      - run: python -m pytest -q
      - name: CLI smoke test (JSON)
        run: |
          vram-fit estimate llama3.1-8b --gpu rtx-4090 -c 32k --json
          vram-fit fit qwen3-30b-a3b --gpu rtx-4060-ti-8gb -c 16k --json
          vram-fit hw --json

  # Python 3.9 is end-of-life and no longer on the hosted runners' toolcache,
  # but vram-fit still supports it: install it with uv (python-build-standalone).
  test-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Test on Python 3.9
        run: |
          uv venv --python 3.9 .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"
          python --version
          python -m pyflakes src tests scripts
          python -m pytest -q
          vram-fit estimate llama3.1-8b --gpu rtx-4090 -c 32k --json > /dev/null

  # llms-full.txt embeds argparse --help output, whose layout changed in Python 3.13:
  # always regenerate it with 3.13 (locally too) so this check is deterministic.
  generated-docs-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python scripts/build_llms_full.py
      - run: python scripts/render_readme_assets.py
      - name: Fail if generated files are stale (run the two scripts above with Python 3.13 and commit)
        run: git diff --exit-code llms-full.txt README.md assets/
