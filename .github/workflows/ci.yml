name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pyflakes src tests scripts
      - run: python -m pytest -q
      - name: CLI smoke test (JSON)
        run: |
          vram-fit estimate llama3.1-8b --gpu rtx-4090 -c 32k --json
          vram-fit fit qwen3-30b-a3b --gpu rtx-4060-ti-8gb -c 16k --json
          vram-fit hw --json

  llms-full-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_llms_full.py
      - run: git diff --exit-code llms-full.txt
