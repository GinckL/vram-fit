  <text x="96" y="92" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="14" letter-spacing="3" fill="#30D158">● OPEN SOURCE · ZERO DEPENDENCIES · --json EVERYWHERE</text>
  <text x="92" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="url(#brand)">vram-fit</text>
  <text x="96" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#E8EAF0">Know your VRAM before you download a single gigabyte.</text>
  <text x="96" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8B90A0">Weights · KV cache · activations · CUDA overhead · LoRA/QLoRA states — from config.json / GGUF headers alone.</text>
