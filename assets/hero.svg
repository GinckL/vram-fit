<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="vram-fit: exact VRAM for local LLMs before you download a single gigabyte">
<title>vram-fit — exact VRAM for local LLMs</title>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#00D1FF"/>
  </linearGradient>
  <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
  </radialGradient>
